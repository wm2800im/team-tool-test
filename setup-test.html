<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initialiser Covoiturage TEST</title><script src="./public-config.js"></script><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17212b}main{max-width:720px;margin:40px auto;padding:20px}.card{background:white;border:1px solid #dde3ea;border-radius:14px;padding:20px}.btn{background:#203a5f;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.box{word-break:break-all;background:#f7f9fb;border:1px solid #dde3ea;padding:10px;border-radius:8px;margin:10px 0}.muted{color:#667085}</style></head><body><main><div class="card"><h1>🧪 Initialisation TEST</h1><p class="muted">À utiliser une seule fois après avoir publié les règles TEST bootstrap.</p><button id="go" class="btn">Initialiser mon accès Igor</button><div id="out"></div></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getAuth,signInAnonymously,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {getFirestore,doc,setDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const cfg=globalThis.COVOIT_ENV?.firebaseConfig||{};const out=document.getElementById('out');
function token(){const b=new Uint8Array(24);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('');}
document.getElementById('go').onclick=async()=>{try{if(!cfg.apiKey||cfg.apiKey==='REMPLACER')throw new Error('Complète d’abord public-config.js avec Firebase TEST.');const app=initializeApp(cfg),auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);if(!auth.currentUser)await signInAnonymously(auth);const db=getFirestore(app),uid=auth.currentUser.uid,t=token();const names={aurelien:'Aurélien',etienne:'Étienne',igor:'Igor',ludo:'Ludo',stephane:'Stéphane'};for(const [id,name] of Object.entries(names))await setDoc(doc(db,'profiles',id),{name});await setDoc(doc(db,'invitations',t),{profileId:'igor',active:true,createdAt:serverTimestamp(),createdBy:'setup-test'});await setDoc(doc(db,'deviceLinks',uid),{profileId:'igor',inviteToken:t,createdAt:serverTimestamp(),userAgent:navigator.userAgent.slice(0,300)});await setDoc(doc(db,'config','calendar'),{exceptions:[]},{merge:true});const base=location.href.replace(/setup-test\.html.*$/,'');const link=`${base}?invite=${t}`;out.innerHTML=`<h2>Accès créé</h2><p>Conserve ce lien TEST :</p><div class="box">${link}</div><p><strong>Étape suivante :</strong> publie les règles <code>firestore.rules.test.txt</code>, puis ouvre <a href="${base}">l’application TEST</a>.</p>`;}catch(e){out.innerHTML=`<p style="color:#b42318">${e.message}</p>`;}};
</script></body></html>
