name: Sync production icons to test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-prod-icons.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy production icons exactly
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/wm2800im/team-tool/main/icon-192.png -o icon-192.png
          curl -fL --retry 3 https://raw.githubusercontent.com/wm2800im/team-tool/main/icon-512.png -o icon-512.png
          test "$(file -b --mime-type icon-192.png)" = "image/png"
          test "$(file -b --mime-type icon-512.png)" = "image/png"
          test -s icon-192.png
          test -s icon-512.png
          sha256sum icon-192.png icon-512.png

      - name: Commit copied icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if git diff --cached --quiet; then
            echo "Icons already identical to production."
            git rm .github/workflows/sync-prod-icons.yml
            git commit -m "chore: confirm production icons in test"
          else
            git commit -m "ui: sync production app icons to test"
            git rm .github/workflows/sync-prod-icons.yml
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
