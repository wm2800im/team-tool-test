name: Apply 4.6 beta.2 Delle history and tie-break

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-4.6-beta2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch app
        run: python3 tools/apply_beta2.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check public-config.js
          node --check service-worker.js
      - name: Commit beta.2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js public-config.js service-worker.js styles.css CHANGEMENTS_4.6.0-beta.2.md
          git commit -m "feat(test): add private Delle history and fair tie-break"
          git push origin HEAD:main
