name: Relais - recette TEST
on:
  push:
    branches: ['relais-test/recette-candidat']
permissions:
  contents: read
jobs:
  relais-recette:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier les données fictives
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat relais-recette/places.txt)" = '3' || { echo 'Recette: 3 places sont attendues.'; exit 1; }
