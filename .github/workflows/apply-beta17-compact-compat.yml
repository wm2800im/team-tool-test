name: Apply beta.17 compact compatibility labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta17-compact-compat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch beta.17
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()
          replacements=[
            ("const APP_VERSION = ENV.version || '4.4.0-beta.16';", "const APP_VERSION = ENV.version || '4.4.0-beta.17';"),
            ("return times.length?{label:`Présent · OK ${times.join(' / ')}`,cls:'present'}:base;", "return times.length?{label:`Présent ${times.join(' / ')}`,cls:'present'}:base;"),
            ("const unknownHtml=proposal.unknown?.length?proposal.unknown.map(x=>`<div>⏳ <strong>${label(x.responder)}</strong> doit répondre à l’impératif de <strong>${label(x.owner)}</strong> · ${timeLabel(x.time)}</div>`).join(''):'';", "const unknownHtml=proposal.unknown?.length?proposal.unknown.map(x=>`<div>⏳ ${label(x.responder)} doit répondre à ${label(x.owner)} · ${timeLabel(x.time)}</div>`).join(''):'';")
          ]
          for old,new in replacements:
            n=s.count(old)
            if n!=1:
              raise SystemExit(f'Expected exactly one occurrence, got {n}: {old[:90]}')
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('public-config.js')
          s=p.read_text()
          old='version: "4.4.0-beta.16"'
          if s.count(old)!=1: raise SystemExit('Unexpected TEST version in public-config.js')
          p.write_text(s.replace(old,'version: "4.4.0-beta.17"',1))

          p=Path('service-worker.js')
          s=p.read_text()
          old="const CACHE='covoiturage-4.4.0-beta.16';"
          if s.count(old)!=1: raise SystemExit('Unexpected TEST cache version')
          p.write_text(s.replace(old,"const CACHE='covoiturage-4.4.0-beta.17';",1))
          PY
      - name: Validate beta.17
        shell: bash
        run: |
          node --check app.js
          git diff --check
          grep -q 'environment: "test"' public-config.js
          grep -q 'projectId: "team-tool-test-data"' public-config.js
          grep -q 'version: "4.4.0-beta.17"' public-config.js
          grep -q "covoiturage-4.4.0-beta.17" service-worker.js
          ! grep -q 'Présent · OK' app.js
          ! grep -q 'Validation possible à partir' app.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text()
          assert "label:`Présent ${times.join(' / ')}`" in s
          assert "⏳ ${label(x.responder)} doit répondre à ${label(x.owner)} · ${timeLabel(x.time)}" in s
          assert 'PENDING_GROUPS_LOGIC_BEGIN' in s
          assert "unknownCompatibilities(ds,g.members).length" in s
          print('beta.17 checks OK')
          PY
      - name: Commit beta.17
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js public-config.js service-worker.js
          git commit -m 'ui: compact imperative compatibility labels'
          git rm .github/workflows/apply-beta17-compact-compat.yml
          git commit --amend --no-edit
          git push origin main
