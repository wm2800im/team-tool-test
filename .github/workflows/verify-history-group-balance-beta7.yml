name: Verify TEST history group balance beta7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-history-group-balance-beta7.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --check app.js
          node --check public-config.js
          node --check service-worker.js
          node --check quota-core.mjs

      - name: Existing quota-safe regression suite
        run: node --test tests/quota-core.test.mjs

      - name: Verify group balance aggregation and UI contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('styles.css','utf8');

          for(const id of ['groupBalanceList','groupBalanceCount']) assert(html.includes(`id="${id}"`), id+' missing');
          for(const cls of ['group-balance-grid','group-balance-card','group-balance-value']) assert(css.includes('.'+cls), cls+' CSS missing');
          assert(app.includes('renderGroupCounterSummary(raw)'));
          assert(app.includes("size===2?'Binômes':`Groupes de ${size}`"));

          const m=app.match(/function buildCurrentGroupCounters\(trips\)\{[\s\S]*?\n\}/);
          assert(m,'buildCurrentGroupCounters missing');
          const canonical=arr=>[...new Set(arr)].sort();
          eval(m[0]);

          const trips=[
            {participants:['ludo','igor'],driver:'igor'},
            {participants:['igor','ludo'],driver:'ludo'},
            {participants:['etienne','igor','ludo'],driver:'igor'},
            {participants:['ludo','etienne','igor'],driver:'etienne'},
            {participants:['igor','ludo','etienne'],driver:'igor'},
            {participants:['aurelien','etienne','stephane'],driver:'stephane'}
          ];
          const c=buildCurrentGroupCounters(trips);
          assert.deepEqual(c.get('igor|ludo'),{igor:1,ludo:1});
          assert.deepEqual(c.get('etienne|igor|ludo'),{etienne:1,igor:2,ludo:0});
          assert.deepEqual(c.get('aurelien|etienne|stephane'),{aurelien:0,etienne:0,stephane:1});
          console.log('Group balance aggregation: OK');
          NODE

      - name: Verify TEST beta7 version
        run: |
          grep -q 'version: "4.8.0-beta.7"' public-config.js
          grep -q "covoiturage-4.8.0-beta.7" service-worker.js
