name: Apply beta.14 last expected trip reminder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta14-last-expected-trip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch reminder scope and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('app.js', "const APP_VERSION = ENV.version || '4.4.0-beta.13';", "const APP_VERSION = ENV.version || '4.4.0-beta.14';")
          replace_once('public-config.js', 'version: "4.4.0-beta.13"', 'version: "4.4.0-beta.14"')
          replace_once('service-worker.js', "const CACHE='covoiturage-4.4.0-beta.13';", "const CACHE='covoiturage-4.4.0-beta.14';")

          old = '''function recentUnvalidatedTripDate(){
  if(!tripDaysReady)return null;
  const now=appNowParts(),today=todayISO();
  let d=fromISO(today);
  for(let i=0;i<10;i++,d=addDays(d,-1)){
    const ds=iso(d);
    if(!isWorkingDayISO(ds))continue;
    if(ds===today&&now.hour<9)continue;
    if(tripGroupsForDate(ds).length)continue;
    const proposal=proposalForDate(ds);
    if(proposal.groups?.length)return ds;
  }
  return null;
}'''
          new = '''function previousWorkingDayISO(ds){
  let d=addDays(fromISO(ds),-1);
  while(!isWorkingDayISO(iso(d)))d=addDays(d,-1);
  return iso(d);
}
function recentUnvalidatedTripDate(){
  if(!tripDaysReady)return null;
  const ds=previousWorkingDayISO(nextCarpoolISO());
  if(tripGroupsForDate(ds).length)return null;
  const proposal=proposalForDate(ds);
  return proposal.groups?.length?ds:null;
}'''
          replace_once('app.js', old, new)

          checks={
            'app.js':["4.4.0-beta.14","function previousWorkingDayISO(ds)","const ds=previousWorkingDayISO(nextCarpoolISO());"],
            'public-config.js':['version: "4.4.0-beta.14"'],
            'service-worker.js':["covoiturage-4.4.0-beta.14"],
          }
          for fn,needles in checks.items():
              text=Path(fn).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{fn}: missing {needle}')
          if 'for(let i=0;i<10' in Path('app.js').read_text(encoding='utf-8'):
              raise SystemExit('Old multi-day reminder scan still present')
          PY
          node --check app.js
          git diff --check

      - name: Commit beta.14
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js public-config.js service-worker.js
          git commit -m "fix: limit reminder to last expected trip"
          git rm .github/workflows/apply-beta14-last-expected-trip.yml
          git commit --amend --no-edit
          git push origin HEAD:main
