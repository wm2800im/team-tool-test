name: Apply beta.14 last expected trip reminder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta14-last-expected-trip.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch reminder scope and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('app.js', "const APP_VERSION = ENV.version || '4.4.0-beta.13';", "const APP_VERSION = ENV.version || '4.4.0-beta.14';")
          replace_once('public-config.js', 'version: "4.4.0-beta.13"', 'version: "4.4.0-beta.14"')
          replace_once('service-worker.js', "const CACHE='covoiturage-4.4.0-beta.13';", "const CACHE='covoiturage-4.4.0-beta.14';")

          p=Path('app.js')
          text=p.read_text(encoding='utf-8')
          start_marker='function recentUnvalidatedTripDate(){'
          end_marker='\nfunction renderUnvalidatedTripAlert(){'
          if text.count(start_marker)!=1 or text.count(end_marker)!=1:
              raise SystemExit('Reminder function markers are not unique')
          start=text.index(start_marker)
          end=text.index(end_marker,start)
          old=text[start:end]
          if 'for(let i=0;i<10' not in old:
              raise SystemExit('Expected old multi-day scan not found')
          new=(
              "function previousWorkingDayISO(ds){\n"
              "  let d=addDays(fromISO(ds),-1);\n"
              "  while(!isWorkingDayISO(iso(d)))d=addDays(d,-1);\n"
              "  return iso(d);\n"
              "}\n"
              "function recentUnvalidatedTripDate(){\n"
              "  if(!tripDaysReady)return null;\n"
              "  const ds=previousWorkingDayISO(nextCarpoolISO());\n"
              "  if(tripGroupsForDate(ds).length)return null;\n"
              "  const proposal=proposalForDate(ds);\n"
              "  return proposal.groups?.length?ds:null;\n"
              "}"
          )
          p.write_text(text[:start]+new+text[end:],encoding='utf-8')

          checks={
            'app.js':["4.4.0-beta.14","function previousWorkingDayISO(ds)","const ds=previousWorkingDayISO(nextCarpoolISO());"],
            'public-config.js':['version: "4.4.0-beta.14"'],
            'service-worker.js':["covoiturage-4.4.0-beta.14"],
          }
          for fn,needles in checks.items():
              text=Path(fn).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{fn}: missing {needle}')
          if 'for(let i=0;i<10' in Path('app.js').read_text(encoding='utf-8'):
              raise SystemExit('Old multi-day reminder scan still present')
          PY
          node --check app.js
          git diff --check

      - name: Commit beta.14
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js public-config.js service-worker.js
          git commit -m "fix: limit reminder to last expected trip"
          git rm .github/workflows/apply-beta14-last-expected-trip.yml
          git commit --amend --no-edit
          git push origin HEAD:main
