name: Apply imperative beta9

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-imperatif-wording.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_imperatif_beta9.py
      - name: Check JavaScript
        run: node --check app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html public-config.js service-worker.js
          git commit -m "feat: add unknown late departure option"
          git push origin HEAD:main
