name: Apply beta.13 selection guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta13-selection-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch selection guard and version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('app.js', "const APP_VERSION = ENV.version || '4.4.0-beta.12';", "const APP_VERSION = ENV.version || '4.4.0-beta.13';")
          replace_once('public-config.js', 'version: "4.4.0-beta.12"', 'version: "4.4.0-beta.13"')
          replace_once('service-worker.js', "const CACHE='covoiturage-4.4.0-beta.12';", "const CACHE='covoiturage-4.4.0-beta.13';")

          app=Path('app.js')
          text=app.read_text(encoding='utf-8')
          old="qsa('.group-check:checked').map(x=>x.value)"
          count=text.count(old)
          if count!=2:
              raise SystemExit(f'Expected 2 active-selection selectors, found {count}')
          text=text.replace(old,"qsa('.group-check:checked:not(:disabled)').map(x=>x.value)")
          app.write_text(text,encoding='utf-8')

          checks={
            'app.js':["4.4.0-beta.13",".group-check:checked:not(:disabled)","function recentUnvalidatedTripDate()","function openUnvalidatedTrip(ds)"],
            'public-config.js':['version: "4.4.0-beta.13"'],
            'service-worker.js':["covoiturage-4.4.0-beta.13"],
          }
          for fn,needles in checks.items():
              text=Path(fn).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{fn}: missing {needle}')
          PY
          node --check app.js
          git diff --check

      - name: Commit beta.13
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js public-config.js service-worker.js
          git commit -m "fix: ignore loaded groups in manual selection"
          git rm .github/workflows/apply-beta13-selection-fix.yml
          git commit --amend --no-edit
          git push origin HEAD:main
