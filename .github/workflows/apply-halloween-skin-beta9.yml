name: Apply elegant Halloween skin TEST beta9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-halloween-skin-beta9.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply seasonal Halloween skin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # app.js: version + automatic October-only activation.
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const APP_VERSION = ENV.version || '4.8.0-beta.8';"
          if s.count(old)!=1:
              raise SystemExit('Version app TEST inattendue')
          s=s.replace(old,"const APP_VERSION = ENV.version || '4.8.0-beta.9';",1)

          marker="""const todayISO = () => appTodayISO();"""
          if s.count(marker)!=1:
              raise SystemExit('Point insertion saison introuvable')
          seasonal="""const HALLOWEEN_SKIN_START = '2026-10-01';
          const HALLOWEEN_SKIN_END = '2026-10-31';
          const halloweenSkinActive = ds => ds >= HALLOWEEN_SKIN_START && ds <= HALLOWEEN_SKIN_END;
          function applySeasonalSkin(){
            const active=halloweenSkinActive(appTodayISO());
            document.documentElement.classList.toggle('season-halloween',active);
            const themeMeta=document.querySelector('meta[name="theme-color"]');
            if(themeMeta)themeMeta.setAttribute('content',active?'#4b2948':'#203a5f');
          }
          applySeasonalSkin();
          """
          s=s.replace(marker,seasonal+marker,1)
          p.write_text(s,encoding='utf-8')

          # styles.css: lightweight/elegant seasonal layer only; no layout/business changes.
          p=Path('styles.css')
          s=p.read_text(encoding='utf-8')
          if 'HALLOWEEN TEST beta9' in s:
              raise SystemExit('Skin Halloween déjà présent')
          skin=r'''

          /* HALLOWEEN TEST beta9 — habillage léger et élégant, actif uniquement en octobre 2026 */
          html.season-halloween{
            --bg:#f7f2ee;
            --card:#fffaf6;
            --ink:#2b2230;
            --muted:#766b78;
            --line:#e8d8ca;
            --brand:#5b3157;
            --brand2:#8b567d;
            --soft:#f3e7df;
            --warn:#bd6818;
            --shadow:0 2px 9px rgba(75,41,72,.07);
          }
          html.season-halloween body{
            background:
              radial-gradient(circle at 6% -4%,rgba(210,116,34,.10),transparent 28rem),
              radial-gradient(circle at 96% 4%,rgba(91,49,87,.08),transparent 30rem),
              var(--bg);
          }
          html.season-halloween header{
            background:rgba(255,250,246,.94);
            border-bottom-color:#e7d2bf;
            box-shadow:0 2px 14px rgba(75,41,72,.05);
          }
          html.season-halloween .test-banner{
            background:linear-gradient(90deg,#3a2238,#5b3157 56%,#6d3d54);
            color:#fff7ef;
            border-bottom:1px solid rgba(232,151,70,.34);
          }
          html.season-halloween .test-banner::after{
            content:'  ·  🎃 Halloween';
            color:#f0a25c;
            font-weight:900;
          }
          html.season-halloween nav button.active,
          html.season-halloween .segmented button.active{
            background:linear-gradient(135deg,#4b2948,#6e3d60);
            border-color:#6e3d60;
            color:#fff;
            box-shadow:0 3px 10px rgba(91,49,87,.18);
          }
          html.season-halloween .btn:not(.secondary):not(.danger):not(.ok):not(.ghost){
            background:linear-gradient(135deg,#51304e,#71405f);
            box-shadow:0 2px 7px rgba(91,49,87,.15);
          }
          html.season-halloween .btn.secondary{
            background:#f3e7df;
            color:#5b3157;
          }
          html.season-halloween .card{
            border-color:#e8d8ca;
            box-shadow:var(--shadow);
          }
          html.season-halloween .tomorrow-card,
          html.season-halloween .group-balance-shell{
            box-shadow:inset 0 2px 0 rgba(215,119,37,.62),var(--shadow);
          }
          html.season-halloween .mini-panel,
          html.season-halloween .group-card,
          html.season-halloween .group-balance-card{
            border-color:#eadbce;
          }
          html.season-halloween .pill{
            background:#f2e4dc;
          }
          html.season-halloween input:focus,
          html.season-halloween select:focus,
          html.season-halloween .input:focus{
            outline:2px solid rgba(210,116,34,.35);
            outline-offset:1px;
            border-color:#d99857;
          }
          html.season-halloween .loading-overlay{
            background:rgba(247,242,238,.95);
          }
          html.season-halloween .loading-card{
            border-color:#e4d2c3;
            box-shadow:0 16px 42px rgba(75,41,72,.12);
          }
          html.season-halloween .spinner{
            border-color:#eadfd6;
            border-top-color:#c97829;
          }
          html.season-halloween .side-menu{
            border-left-color:#e5d3c5;
            box-shadow:-16px 0 42px rgba(75,41,72,.13);
          }
          html.season-halloween .group-balance-code,
          html.season-halloween .big,
          html.season-halloween .kpi strong{
            color:#5b3157;
          }
          html.season-halloween .coffee-link-btn{
            border-color:#e1c9b7;
          }

          html.season-halloween[data-theme="dark"]{
            --bg:#141116;
            --card:#201920;
            --ink:#f5ece7;
            --muted:#b9aab6;
            --line:#3c303b;
            --soft:#2b222a;
            --brand:#e49a52;
            --brand2:#d79ac5;
            --warn:#f0a35b;
            --shadow:0 2px 10px rgba(0,0,0,.22);
          }
          html.season-halloween[data-theme="dark"] body{
            background:
              radial-gradient(circle at 6% -4%,rgba(226,139,58,.08),transparent 27rem),
              radial-gradient(circle at 96% 4%,rgba(123,65,111,.13),transparent 30rem),
              var(--bg);
          }
          html.season-halloween[data-theme="dark"] header{
            background:rgba(32,25,32,.95);
            border-bottom-color:#493847;
          }
          html.season-halloween[data-theme="dark"] .card,
          html.season-halloween[data-theme="dark"] .loading-card,
          html.season-halloween[data-theme="dark"] .side-menu{
            background:var(--card);
            border-color:var(--line);
          }
          html.season-halloween[data-theme="dark"] .btn.secondary,
          html.season-halloween[data-theme="dark"] .pill{
            background:#30242d;
            color:#efb47a;
          }
          html.season-halloween[data-theme="dark"] nav button.active,
          html.season-halloween[data-theme="dark"] .segmented button.active,
          html.season-halloween[data-theme="dark"] .btn:not(.secondary):not(.danger):not(.ok):not(.ghost){
            background:linear-gradient(135deg,#7c4369,#9b5a63);
            color:#fff8f1;
          }
          html.season-halloween[data-theme="dark"] .group-balance-code,
          html.season-halloween[data-theme="dark"] .big,
          html.season-halloween[data-theme="dark"] .kpi strong{
            color:#efa55d;
          }
          html.season-halloween[data-theme="dark"] .loading-overlay{
            background:rgba(20,17,22,.96);
          }
          '''
          p.write_text(s+skin,encoding='utf-8')

          # TEST config version only; keep Firebase TEST untouched.
          p=Path('public-config.js')
          s=p.read_text(encoding='utf-8')
          if s.count('version: "4.8.0-beta.8"')!=1:
              raise SystemExit('Version public-config TEST inattendue')
          s=s.replace('// 4.8 beta.8 — filtre instantané du bilan des groupes par initiales',
                      '// 4.8 beta.9 — skin Halloween léger et élégant, automatique jusqu’au 31/10/2026',1)
          s=s.replace('version: "4.8.0-beta.8"','version: "4.8.0-beta.9"',1)
          p.write_text(s,encoding='utf-8')

          # Force refresh of PWA shell.
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE='covoiturage-4.8.0-beta.8';"
          if s.count(old)!=1:
              raise SystemExit('Cache service worker TEST inattendu')
          s=s.replace(old,"const CACHE='covoiturage-4.8.0-beta.9';",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          node --check app.js
          node --check public-config.js
          node --check service-worker.js
          node --check quota-core.mjs
          node --test tests/quota-core.test.mjs
          git diff --check

      - name: Verify Halloween activation and isolation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const app=fs.readFileSync('app.js','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const cfg=fs.readFileSync('public-config.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');

          assert(app.includes("HALLOWEEN_SKIN_START = '2026-10-01'"));
          assert(app.includes("HALLOWEEN_SKIN_END = '2026-10-31'"));
          assert(app.includes("classList.toggle('season-halloween',active)"));
          assert(css.includes('HALLOWEEN TEST beta9'));
          assert(css.includes('html.season-halloween[data-theme="dark"]'));
          assert(css.includes("content:'  ·  🎃 Halloween'"));
          assert(cfg.includes('environment: "test"'));
          assert(cfg.includes('projectId: "team-tool-test-data"'));
          assert(cfg.includes('version: "4.8.0-beta.9"'));
          assert(sw.includes("covoiturage-4.8.0-beta.9"));
          assert(!cfg.includes('projectId: "team-tool-data"'));

          const START='2026-10-01', END='2026-10-31';
          const active=ds=>ds>=START&&ds<=END;
          assert.equal(active('2026-09-30'),false);
          assert.equal(active('2026-10-01'),true);
          assert.equal(active('2026-10-15'),true);
          assert.equal(active('2026-10-31'),true);
          assert.equal(active('2026-11-01'),false);
          console.log('Halloween window and TEST isolation: OK');
          NODE

      - name: Commit TEST beta9
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css public-config.js service-worker.js
          git commit -m 'style(test): elegant Halloween skin beta9'
          git push origin HEAD:main

      - name: Smoke test deployed TEST site
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://wm2800im.github.io/team-tool-test'
          ok=0
          for i in $(seq 1 30); do
            stamp=$(date +%s)
            if curl -fsSL --max-time 15 "$BASE/public-config.js?v=$stamp" -o /tmp/live-config.js \
              && curl -fsSL --max-time 15 "$BASE/app.js?v=$stamp" -o /tmp/live-app.js \
              && curl -fsSL --max-time 15 "$BASE/styles.css?v=$stamp" -o /tmp/live-styles.css \
              && curl -fsSL --max-time 15 "$BASE/service-worker.js?v=$stamp" -o /tmp/live-sw.js \
              && grep -q 'version: "4.8.0-beta.9"' /tmp/live-config.js \
              && grep -q 'projectId: "team-tool-test-data"' /tmp/live-config.js \
              && grep -q 'HALLOWEEN_SKIN_END' /tmp/live-app.js \
              && grep -q 'HALLOWEEN TEST beta9' /tmp/live-styles.css \
              && grep -q 'covoiturage-4.8.0-beta.9' /tmp/live-sw.js; then
                ok=1; break
            fi
            echo "Pages TEST pas encore à jour (tentative $i/30)"
            sleep 10
          done
          test "$ok" = 1
          echo 'Smoke test TEST Halloween beta9: OK'
