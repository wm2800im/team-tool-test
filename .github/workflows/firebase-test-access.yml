name: Vérifier l’accès Google Cloud TEST

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: github.repository_id == '1356239565' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtenir un jeton fédéré temporaire
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: team-tool-test-data
          workload_identity_provider: projects/398960207483/locations/global/workloadIdentityPools/teamtool-test-github/providers/github
          create_credentials_file: false
          export_environment_variables: false

      - name: Vérifier les métadonnées du projet TEST
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.auth_token }}
        run: |
          set -euo pipefail
          response=$(mktemp)
          status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            'https://cloudresourcemanager.googleapis.com/v3/projects/398960207483')
          if [[ "$status" != 200 ]]; then
            jq -c '.error | {code, status, message, reasons: [.details[]?.reason | select(. != null)]}' "$response"
            exit 1
          fi
          jq --exit-status '.projectId == "team-tool-test-data" and .name == "projects/398960207483"' "$response"

      - name: Vérifier la préparation Firebase TEST (lecture seule)
        env:
          TEST_FIREBASE_AUTH_TOKEN: ${{ steps.auth.outputs.auth_token }}
        run: node scripts/firebase-test-readiness.mjs
