name: Apply beta.16 compatibility clarity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta16-compatibility-clarity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply_beta16.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate diff and environment
        run: git diff --check && grep -q 'environment: "test"' public-config.js && grep -q 'projectId: "team-tool-test-data"' public-config.js && grep -q '4.4.0-beta.16' public-config.js && grep -q "covoiturage-4.4.0-beta.16" service-worker.js
      - name: Validate no 7h restriction
        run: '! grep -q "Validation possible à partir" app.js && ! grep -Eq "hour[^\n]*[<>]=?[^\n]*7|7[^\n]*hour" app.js'
      - name: Run compatibility tests
        run: node scripts/test_beta16_logic.js
      - name: Commit beta.16
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js public-config.js service-worker.js
          git commit -m 'feat: clarify pending imperative compatibility'
          git rm .github/workflows/apply-beta16-compatibility-clarity.yml scripts/apply_beta16.py scripts/test_beta16_logic.js
          git commit --amend --no-edit
          git push origin main
