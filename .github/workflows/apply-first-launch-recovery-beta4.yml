name: Apply first-launch recovery beta4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-first-launch-recovery-beta4.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden first-launch baseline recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('quota-core.mjs')
          s=p.read_text(encoding='utf-8')
          marker="""export function isValidBaseline(baseline, expectedLiveStart = HISTORY_LIVE_START) {
            return !!baseline
              && baseline.schema === QUOTA_BASELINE_SCHEMA
              && baseline.liveStart === expectedLiveStart
              && typeof baseline.generation === 'string'
              && Array.isArray(baseline.tripDays)
              && Array.isArray(baseline.availability)
              && Array.isArray(baseline.legacyStatus)
              && Array.isArray(baseline.plans);
          }
          """
          insert=marker+"""
          export function selectFreshBaseline(local, server, dirtyAtMs = 0, expectedLiveStart = HISTORY_LIVE_START) {
            const candidates = [local, server].filter(b => isValidBaseline(b, expectedLiveStart));
            const freshest = candidates.sort((a,b) => Number(b.generatedAtMs || 0) - Number(a.generatedAtMs || 0))[0] || null;
            return freshest && Number(freshest.generatedAtMs || 0) >= Number(dirtyAtMs || 0) ? freshest : null;
          }
          """
          if s.count(marker)!=1: raise SystemExit('quota core insertion marker mismatch')
          s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          if s.count("const APP_VERSION = ENV.version || '4.8.0-beta.3';")!=1: raise SystemExit('app version mismatch')
          s=s.replace("const APP_VERSION = ENV.version || '4.8.0-beta.3';","const APP_VERSION = ENV.version || '4.8.0-beta.4';",1)
          old="""  HISTORY_LIVE_START, makeArchiveBaseline, splitBaselineParts, combineBaselineParts,
            isValidBaseline, applyArchiveBaseline, replaceLiveEntries
          } from './quota-core.mjs';"""
          new="""  HISTORY_LIVE_START, makeArchiveBaseline, splitBaselineParts, combineBaselineParts,
            isValidBaseline, selectFreshBaseline, applyArchiveBaseline, replaceLiveEntries
          } from './quota-core.mjs';"""
          if s.count(old)!=1: raise SystemExit('app quota import mismatch')
          s=s.replace(old,new,1)

          old="""  applyQuotaBaseline(baseline);
            if(publish&&linkedProfileId==='igor')await publishQuotaBaseline(baseline);
            return baseline;
          }"""
          new="""  applyQuotaBaseline(baseline);
            if(publish&&linkedProfileId==='igor'){
              try{await publishQuotaBaseline(baseline);}
              catch(e){
                console.warn('Publication de la baseline différée : la copie locale reste utilisable.',e);
                setTimeout(()=>publishQuotaBaseline(baseline).catch(err=>console.warn('Nouvelle tentative de publication baseline',err)),1500);
              }
            }
            return baseline;
          }"""
          if s.count(old)!=1: raise SystemExit('rebuild publish block mismatch')
          s=s.replace(old,new,1)

          old="""      const [server,dirtyAtMs]=await Promise.all([readServerQuotaBaseline(),readQuotaDirtyAtMs()]);
                const candidates=[local,server].filter(b=>isValidBaseline(b,HISTORY_LIVE_START));
                const freshest=candidates.sort((a,b)=>Number(b.generatedAtMs||0)-Number(a.generatedAtMs||0))[0]||null;
                if(freshest&&Number(freshest.generatedAtMs||0)>=dirtyAtMs){
                  if(!local||freshest.generation!==local.generation)applyQuotaBaseline(freshest);
                  return freshest;
                }
                return await rebuildQuotaBaseline({publish:linkedProfileId==='igor'});
              }catch(e){
                if(local){console.warn('Baseline serveur indisponible, utilisation du cache local.',e);return local;}
                throw e;
              }"""
          new="""      const [server,dirtyAtMs]=await Promise.all([readServerQuotaBaseline(),readQuotaDirtyAtMs()]);
                const freshest=selectFreshBaseline(local,server,dirtyAtMs,HISTORY_LIVE_START);
                if(freshest){
                  if(!local||freshest.generation!==local.generation)applyQuotaBaseline(freshest);
                  if(!server&&linkedProfileId==='igor')setTimeout(()=>publishQuotaBaseline(freshest).catch(err=>console.warn('Publication baseline locale',err)),0);
                  return freshest;
                }
                return await rebuildQuotaBaseline({publish:linkedProfileId==='igor'});
              }catch(e){
                const recovered=readLocalQuotaBaseline();
                if(recovered){
                  applyQuotaBaseline(recovered);
                  console.warn('Baseline serveur indisponible au démarrage, récupération locale réussie.',e);
                  if(linkedProfileId==='igor')setTimeout(()=>publishQuotaBaseline(recovered).catch(err=>console.warn('Publication baseline récupérée',err)),0);
                  return recovered;
                }
                throw e;
              }"""
          if s.count(old)!=1: raise SystemExit('ensure baseline block mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/quota-core.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="""  isValidBaseline,
            applyArchiveBaseline,"""
          new="""  isValidBaseline,
            selectFreshBaseline,
            applyArchiveBaseline,"""
          if s.count(old)!=1: raise SystemExit('test import marker mismatch')
          s=s.replace(old,new,1)
          marker="""test('generation mismatch is rejected',()=>{
            const parts=splitBaselineParts(makeArchiveBaseline({generation:'g3',generatedAtMs:3}));
            parts.plans={...parts.plans,generation:'other'};
            assert.throws(()=>combineBaselineParts(parts),/Génération incohérente/);
          });
          """
          extra=marker+"""
          test('first launch can immediately reuse a freshly built local baseline',()=>{
            const local=makeArchiveBaseline({generation:'local-first',generatedAtMs:100});
            assert.equal(selectFreshBaseline(local,null,0)?.generation,'local-first');
          });

          test('a dirty marker newer than local baseline forces a rebuild',()=>{
            const local=makeArchiveBaseline({generation:'local-stale',generatedAtMs:100});
            assert.equal(selectFreshBaseline(local,null,101),null);
          });

          test('newer server baseline wins over older local cache',()=>{
            const local=makeArchiveBaseline({generation:'local-old',generatedAtMs:100});
            const server=makeArchiveBaseline({generation:'server-new',generatedAtMs:120});
            assert.equal(selectFreshBaseline(local,server,0)?.generation,'server-new');
          });
          """
          if s.count(marker)!=1: raise SystemExit('test insertion marker mismatch')
          s=s.replace(marker,extra,1)
          p.write_text(s,encoding='utf-8')

          p=Path('public-config.js');s=p.read_text(encoding='utf-8')
          s=s.replace('// 4.8 beta.3 — fenêtre live mensuelle glissante + cache persistant','// 4.8 beta.4 — récupération premier lancement + publication baseline non bloquante',1)
          if s.count('version: "4.8.0-beta.3"')!=1: raise SystemExit('public version mismatch')
          s=s.replace('version: "4.8.0-beta.3"','version: "4.8.0-beta.4"',1)
          p.write_text(s,encoding='utf-8')

          p=Path('service-worker.js');s=p.read_text(encoding='utf-8')
          if s.count("const CACHE='covoiturage-4.8.0-beta.3';")!=1: raise SystemExit('SW version mismatch')
          s=s.replace("const CACHE='covoiturage-4.8.0-beta.3';","const CACHE='covoiturage-4.8.0-beta.4';",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax checks
        run: |
          node --check app.js
          node --check quota-core.mjs
          node --check public-config.js
          node --check service-worker.js
          node --check notify-runner.mjs
          git diff --check

      - name: Unit tests
        run: node --test tests/quota-core.test.mjs

      - name: First-launch recovery assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "selectFreshBaseline" app.js
          grep -q "selectFreshBaseline" quota-core.mjs
          grep -q "récupération locale réussie" app.js
          grep -q "Publication de la baseline différée" app.js
          grep -q "if(!server&&linkedProfileId==='igor')" app.js
          grep -q 'version: "4.8.0-beta.4"' public-config.js
          grep -q "const CACHE='covoiturage-4.8.0-beta.4'" service-worker.js

      - name: Commit TEST 4.8.0-beta.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js quota-core.mjs tests/quota-core.test.mjs public-config.js service-worker.js
          git commit -m 'fix(test): recover optimized history on first launch beta4'
          git push origin HEAD:main
