name: Apply UX polish beta6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ux-polish-beta6.yml'
      - 'tools/ux_beta6_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply beta6 patch
        run: python3 tools/ux_beta6_patch.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check public-config.js
          node --check service-worker.js
          grep -q '4.6.0-beta.6' public-config.js
          grep -q 'Covoiturage jusqu’à Delle' app.js
          if grep -q 'Paramètres des sites' app.js; then exit 1; fi

      - name: Commit beta6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js public-config.js service-worker.js
          git commit -m 'fix(test): simplify notifications and unify Delle card beta6'
          git push origin HEAD:main
