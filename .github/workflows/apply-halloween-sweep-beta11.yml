name: Apply Halloween sweep TEST beta11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-halloween-sweep-beta11.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply dramatic Halloween sweep layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Version only in app.js; seasonal date logic remains unchanged.
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const APP_VERSION = ENV.version || '4.8.0-beta.10';"
          if s.count(old)!=1:
              raise SystemExit('Version app TEST inattendue')
          s=s.replace(old,"const APP_VERSION = ENV.version || '4.8.0-beta.11';",1)
          p.write_text(s,encoding='utf-8')

          # Add non-interactive sweepers once in the DOM.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<div id="testBanner" class="test-banner" style="display:none">🧪 MODE TEST — aucune donnée de production n’est modifiée</div>'
          if s.count(marker)!=1:
              raise SystemExit('Bandeau TEST introuvable')
          if 'id="halloweenSweepers"' in s:
              raise SystemExit('Sweepers déjà présents')
          sweepers='''<div id="halloweenSweepers" class="halloween-sweepers" aria-hidden="true">\n  <span class="halloween-sweeper halloween-ghost">👻</span>\n  <span class="halloween-sweeper halloween-pumpkin">🎃</span>\n  <span class="halloween-sweeper halloween-spider">🕷️</span>\n</div>'''
          s=s.replace(marker,marker+'\n'+sweepers,1)
          p.write_text(s,encoding='utf-8')

          # Much more visible diagonal sweeps. Pointer-events are disabled so the app stays usable.
          p=Path('styles.css')
          s=p.read_text(encoding='utf-8')
          if 'HALLOWEEN TEST beta11' in s:
              raise SystemExit('Skin beta11 déjà présent')
          skin=r'''

          /* HALLOWEEN TEST beta11 — balayages diagonaux très visibles */
          .halloween-sweepers{display:none}
          html.season-halloween .halloween-sweepers{
            display:block;
            position:fixed;
            inset:0;
            z-index:118;
            pointer-events:none;
            overflow:hidden;
            user-select:none;
          }
          html.season-halloween .halloween-sweeper{
            position:absolute;
            left:0;
            top:0;
            opacity:0;
            font-size:clamp(72px,12vw,128px);
            line-height:1;
            will-change:transform,opacity;
            filter:drop-shadow(0 12px 16px rgba(31,12,29,.30));
          }

          /* Un balayage toutes les ~7 secondes : fantôme, citrouille, araignée. */
          html.season-halloween .halloween-ghost{
            animation:halloweenGhostSweep 21s linear infinite;
          }
          html.season-halloween .halloween-pumpkin{
            animation:halloweenPumpkinSweep 21s linear infinite 7s;
          }
          html.season-halloween .halloween-spider{
            animation:halloweenSpiderSweep 21s linear infinite 14s;
          }

          @keyframes halloweenGhostSweep{
            0%,2%{transform:translate(-22vw,-22vh) rotate(-18deg) scale(.82);opacity:0}
            4%{opacity:.94}
            15%{transform:translate(44vw,43vh) rotate(6deg) scale(1.16);opacity:.96}
            27%{transform:translate(112vw,108vh) rotate(18deg) scale(.94);opacity:.88}
            30%,100%{transform:translate(112vw,108vh) rotate(18deg) scale(.94);opacity:0}
          }
          @keyframes halloweenPumpkinSweep{
            0%,2%{transform:translate(112vw,-18vh) rotate(22deg) scale(.80);opacity:0}
            4%{opacity:.96}
            15%{transform:translate(48vw,46vh) rotate(-6deg) scale(1.24);opacity:.98}
            27%{transform:translate(-24vw,110vh) rotate(-24deg) scale(.92);opacity:.90}
            30%,100%{transform:translate(-24vw,110vh) rotate(-24deg) scale(.92);opacity:0}
          }
          @keyframes halloweenSpiderSweep{
            0%,2%{transform:translate(-18vw,108vh) rotate(-28deg) scale(.78);opacity:0}
            4%{opacity:.94}
            15%{transform:translate(48vw,47vh) rotate(10deg) scale(1.14);opacity:.97}
            27%{transform:translate(112vw,-24vh) rotate(30deg) scale(.90);opacity:.88}
            30%,100%{transform:translate(112vw,-24vh) rotate(30deg) scale(.90);opacity:0}
          }

          /* Court halo derrière l’emoji pour qu’il reste visible sur les cartes claires ou sombres. */
          html.season-halloween .halloween-sweeper::after{
            content:'';
            position:absolute;
            inset:12% 4%;
            z-index:-1;
            border-radius:50%;
            background:radial-gradient(circle,rgba(255,151,60,.20),rgba(91,49,87,.06) 52%,transparent 72%);
            filter:blur(8px);
          }

          @media(max-width:520px){
            html.season-halloween .halloween-sweeper{font-size:clamp(78px,24vw,112px)}
          }
          @media(prefers-reduced-motion:reduce){
            html.season-halloween .halloween-sweeper{animation-duration:42s}
          }
          '''
          p.write_text(s+skin,encoding='utf-8')

          # TEST config version only; preserve Firebase TEST.
          p=Path('public-config.js')
          s=p.read_text(encoding='utf-8')
          if s.count('version: "4.8.0-beta.10"')!=1:
              raise SystemExit('Version public-config TEST inattendue')
          s=s.replace('// 4.8 beta.10 — skin Halloween plus visible avec davantage d’icônes, toujours automatique',
                      '// 4.8 beta.11 — grands balayages Halloween diagonaux, toujours automatique',1)
          s=s.replace('version: "4.8.0-beta.10"','version: "4.8.0-beta.11"',1)
          p.write_text(s,encoding='utf-8')

          # Refresh PWA shell.
          p=Path('service-worker.js')
          s=p.read_text(encoding='utf-8')
          old="const CACHE='covoiturage-4.8.0-beta.10';"
          if s.count(old)!=1:
              raise SystemExit('Cache TEST inattendu')
          s=s.replace(old,"const CACHE='covoiturage-4.8.0-beta.11';",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          node --check app.js
          node --check public-config.js
          node --check service-worker.js
          node --check quota-core.mjs
          node --test tests/quota-core.test.mjs
          git diff --check

      - name: Verify sweep layer and TEST isolation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const assert=require('assert/strict');
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const css=fs.readFileSync('styles.css','utf8');
          const cfg=fs.readFileSync('public-config.js','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');

          assert(app.includes("APP_VERSION = ENV.version || '4.8.0-beta.11'"));
          assert(app.includes("HALLOWEEN_SKIN_END = '2026-10-31'"));
          assert(html.includes('id="halloweenSweepers"'));
          assert(html.includes('halloween-ghost'));
          assert(html.includes('halloween-pumpkin'));
          assert(html.includes('halloween-spider'));
          assert(css.includes('HALLOWEEN TEST beta11'));
          assert(css.includes('@keyframes halloweenGhostSweep'));
          assert(css.includes('@keyframes halloweenPumpkinSweep'));
          assert(css.includes('@keyframes halloweenSpiderSweep'));
          assert(css.includes('z-index:118'));
          assert(css.includes('pointer-events:none'));
          assert(cfg.includes('environment: "test"'));
          assert(cfg.includes('projectId: "team-tool-test-data"'));
          assert(cfg.includes('version: "4.8.0-beta.11"'));
          assert(!cfg.includes('projectId: "team-tool-data"'));
          assert(sw.includes("covoiturage-4.8.0-beta.11"));
          console.log('Halloween diagonal sweeps beta11: OK');
          NODE

      - name: Commit TEST beta11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles.css public-config.js service-worker.js
          git commit -m 'style(test): add dramatic Halloween diagonal sweeps beta11'
          git push origin HEAD:main

      - name: Smoke test deployed TEST site
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://wm2800im.github.io/team-tool-test'
          ok=0
          for i in $(seq 1 30); do
            stamp=$(date +%s)
            if curl -fsSL --max-time 15 "$BASE/public-config.js?v=$stamp" -o /tmp/live-config.js \
              && curl -fsSL --max-time 15 "$BASE/app.js?v=$stamp" -o /tmp/live-app.js \
              && curl -fsSL --max-time 15 "$BASE/index.html?v=$stamp" -o /tmp/live-index.html \
              && curl -fsSL --max-time 15 "$BASE/styles.css?v=$stamp" -o /tmp/live-styles.css \
              && curl -fsSL --max-time 15 "$BASE/service-worker.js?v=$stamp" -o /tmp/live-sw.js \
              && grep -q 'version: "4.8.0-beta.11"' /tmp/live-config.js \
              && grep -q 'projectId: "team-tool-test-data"' /tmp/live-config.js \
              && grep -q 'id="halloweenSweepers"' /tmp/live-index.html \
              && grep -q 'halloweenGhostSweep' /tmp/live-styles.css \
              && grep -q 'covoiturage-4.8.0-beta.11' /tmp/live-sw.js; then
                ok=1; break
            fi
            echo "Pages TEST pas encore à jour (tentative $i/30)"
            sleep 10
          done
          test "$ok" = 1
          echo 'Smoke test TEST Halloween sweep beta11: OK'
