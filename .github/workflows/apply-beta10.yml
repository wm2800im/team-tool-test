name: Apply beta.10 imperative fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply beta.10 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app.js',
              "const APP_VERSION = ENV.version || '4.4.0-beta.9';",
              "const APP_VERSION = ENV.version || '4.4.0-beta.10';"
          )
          replace_once(
              'app.js',
              "const timeLabel = value => value===LATE_UNKNOWN ? 'Tard · heure inconnue' : (value||'');",
              "const timeLabel = value => value===LATE_UNKNOWN ? 'Tard / inconnu' : (value||'');"
          )
          replace_once(
              'app.js',
              "async function handleTomorrowStatus(st){\n  if(st==='time'){const v=getAvail(nextCarpoolISO(),profileId);$('timeLimit').value=v?.time||'16:15';$('timeBox').style.display='flex';return;}\n  $('timeBox').style.display='none';await setAvailability(nextCarpoolISO(),st,null);\n}",
              "async function handleTomorrowStatus(st){\n  const ds=nextCarpoolISO();\n  if(st==='time'){\n    const v=getAvail(ds,profileId);\n    const selected=(v?.status==='time'&&v?.time)?v.time:'16:15';\n    $('timeLimit').value=selected;\n    $('timeBox').style.display='flex';\n    if(v?.status!=='time'||v?.time!==selected) await setAvailability(ds,'time',selected);\n    return;\n  }\n  $('timeBox').style.display='none';await setAvailability(ds,st,null);\n}"
          )
          replace_once(
              'public-config.js',
              'version: "4.4.0-beta.9",',
              'version: "4.4.0-beta.10",'
          )
          replace_once(
              'service-worker.js',
              "const CACHE='covoiturage-4.4.0-beta.9';",
              "const CACHE='covoiturage-4.4.0-beta.10';"
          )
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-beta10.yml
          git add app.js public-config.js service-worker.js
          git commit -m "fix: persist imperative status immediately"
          git push origin HEAD:main
