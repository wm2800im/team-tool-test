name: TEST — sécurité des règles Firestore
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer les outils de test locaux
        run: npm install --no-save --no-audit --no-fund firebase@13.3.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.36.0
      - name: Tester les règles avec un émulateur (aucune base réelle)
        run: npx firebase emulators:exec --config firestore.rules-test.firebase.json --only firestore --project demo-teamtool-rules 'node --test tests/firestore-rules.emulator.mjs'
