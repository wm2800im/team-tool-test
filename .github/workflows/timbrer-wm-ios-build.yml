name: TIMBRER WM iOS build

on:
  push:
    branches: [timbrer-wm-v1]
    paths:
      - 'timbrer-wm-ios/**'
      - '.github/workflows/timbrer-wm-ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Unpack source
        run: unzip -q timbrer-wm-v1-source.zip
      - name: Generate Xcode project
        working-directory: timbrer-wm-ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: timbrer-wm-ios
        run: |
          xcodebuild \
            -project TimbrerWM.xcodeproj \
            -scheme TimbrerWM \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package source
        run: zip -qr TimbrerWM-v1-source.zip timbrer-wm-ios
      - uses: actions/upload-artifact@v4
        with:
          name: TimbrerWM-v1-source
          path: TimbrerWM-v1-source.zip
